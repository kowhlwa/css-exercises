<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Modal</title>
  </head>
  <body>
    <div class="modal">

      <!-- The icon itself will be its own column. -->
      <div class="icon">!</div>

      <!-- The prompt will be its own columnar flex-box container. -->
      <div class = "prompt">

        <!-- The header title alongside the button will be the first row within the second column. -->
        <div class = "first">
          <div class="header"><strong>Are you sure you want to do that?</strong></div>
          <button class="close-button">✖</button>
        </div>

        <!-- The text will be the second row within the second column. -->
        <div class="text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Pariatur excepturi id soluta, numquam minima rerum doloremque eveniet aspernatur beatae commodi. Cupiditate recusandae ad repellendus quidem consectetur sequi amet aspernatur cumque!</div>
        
        <!-- The action buttons will be the botton row within the second column. -->
        <div class = "actions">
          <button class="continue">Continue</button>
          <button class="cancel">Cancel</button>
        </div>

      </div>
    </div>
  </body>
</html>
